<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>購物車頁</title>
  </head>
  <body>
    <%- include('./layout/header'); -%>
    <div class="bg-neutral-10">
      <div class="container py-lg-12 py-8">
        <div class="row">
          <div class="col-8">
            <div class="d-flex align-items-center justify-content-between bg-white border rounded-20 py-4 px-6 mb-8">
              <div class="form-check">
                <input class="form-check-input me-2" type="checkbox" value="" id="flexCheckDefault">
                <label class="form-check-label" for="flexCheckDefault">
                  全選
                </label>
              </div>
              <button type="button" class="btn btn-white border border-1 border-primary rounded-4">刪除選中活動</button>
            </div>
            <div class="d-flex align-items-center flex-column bg-white border rounded-20 py-7 ps-6 pe-7 mb-6">
              <div class="d-flex justify-content-between w-100">
                <div class="form-check">
                  <input class="form-check-input me-6" type="checkbox" value="" id="flexCheckDefault">
                  <label class="form-check-label d-flex" for="flexCheckDefault">
                    <img src="/assets/images/cart/cart-1.png" class="me-3 rounded-5" alt="cart-1">
                    <div class="d-flex flex-column justify-content-center">
                      <h2 class="fs-6 fw-bold mb-2">海闊天空展望台門票 HARUKAS 300</h2>
                      <p class="text-neutral-80 mb-2">阿倍野展望台門票 HARUKAS 300｜附章魚燒兌換劵</p>
                      <p class="text-neutral-80">兌換期內皆適用</p>
                    </div>
                  </label>
                </div>
                <div class="d-flex align-items-center">
                  <button type="button" class="d-inline-block bg-white border border-1 rounded-circle p-3">
                    <span class="d-block material-symbols-outlined">check_indeterminate_small</span>
                  </button>
                  <span class="fs-6 fw-bold p-4">2</span>
                  <button type="button" class="d-inline-block bg-white border border-1 rounded-circle p-3">
                    <span class="d-block material-symbols-outlined">add</span>
                  </button>
                </div>
              </div>
              <div class="py-4">
                <a href="#" class="text-neutral-80 py-2">編輯</a>
              </div>
            </div>
          </div>
          <div class="col-4"></div>
        </div>
      </div>
    </div>

    <%- include('./layout/footer'); -%>

    <script type="module" src="../main.js"></script>

  </body>
</html>
